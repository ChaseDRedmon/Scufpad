name: Validate PR

on:
  pull_request:
    branches: [release]

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Only the dev branch can be merged into release. Source: ${{ github.head_ref }}"
            exit 1
          fi
          echo "Source branch is dev. OK."
