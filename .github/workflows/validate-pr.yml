name: Validate PR

on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify release source
        # One-time migration exception; normal releases continue to come from dev.
        run: |
          if [ "$SOURCE_REPO" != "$GH_REPO" ]; then
            echo "::error::Release PRs must originate in this repository."
            exit 1
          fi
          case "$SOURCE_BRANCH" in
            dev|migration/rust-rewrite) ;;
            *) echo "::error::Release source must be dev or migration/rust-rewrite."; exit 1 ;;
          esac
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_REPO: ${{ github.repository }}
