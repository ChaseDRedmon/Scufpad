name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: rust-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: scufpad-rust-linux-x64
          path: ${{ runner.temp }}/release-assets
      - name: Verify release archive
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum --check scufpad-rust-linux-x64.tar.gz.sha256
      - name: Determine next version
        id: version
        run: |
          tag=$(python3 tools/next_release_tag.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Publish native Rust applications (resume the same release on retry)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Scufpad ${{ steps.version.outputs.tag }}
          draft: false
          make_latest: legacy
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release-assets/scufpad-rust-linux-x64.tar.gz
            ${{ runner.temp }}/release-assets/scufpad-rust-linux-x64.tar.gz.sha256
