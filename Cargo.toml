[workspace]
members = ["crates/scufpad-core", "crates/scufpad", "crates/scufpad-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
scufpad-core = { path = "crates/scufpad-core" }
